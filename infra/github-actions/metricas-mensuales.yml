# ACTIVACIÓN: copia este archivo a .github/workflows/metricas-mensuales.yml (el token del agente no tiene
# el permiso `workflow` de GitHub, así que no puede publicar workflows; hazlo tú desde la web o con git).
#
# Recalcula cada mes las métricas públicas y la puntuación de calidad del catálogo y abre un PR.
# Nunca empuja a main: crea la rama metricas/AAAA-MM y propone los cambios en un pull request.
#
# Requisito: en Settings → Actions → General → Workflow permissions, activa
# «Allow GitHub Actions to create and approve pull requests». Sin ese permiso el paso
# «Abrir pull request» falla con «GitHub Actions is not permitted to create or approve pull requests».
#
# Límite de tasa: GITHUB_TOKEN permite 1.000 peticiones REST por hora. El recolector espera al
# reinicio del límite cuando se agota; si quieres que termine antes, crea un secreto
# METRICAS_TOKEN (token personal de solo lectura de repos públicos) y se usará en su lugar
# para las consultas (el PR se sigue abriendo con GITHUB_TOKEN).
name: Métricas mensuales de calidad

on:
  schedule:
    - cron: "17 9 1 * *"   # día 1 de cada mes, 09:17 UTC (03:17 en Ciudad de México)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: metricas-mensuales
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Dependencias del proyecto
        run: uv sync --frozen

      - name: Recalcular métricas y puntuación
        env:
          GH_TOKEN: ${{ secrets.METRICAS_TOKEN || secrets.GITHUB_TOKEN }}
        run: uv run repo-intelligence score --refrescar

      - name: Regenerar guías, menú y web
        run: |
          uv run repo-intelligence guide build
          uv run repo-intelligence menu export
          uv run repo-intelligence web build
          uv run repo-intelligence web build -o docs

      - name: Tests
        run: uv run pytest -q

      - name: Abrir pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios en las métricas."
            exit 0
          fi
          BRANCH="metricas/$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Métricas mensuales de calidad $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "Métricas mensuales de calidad $(date -u +%Y-%m)" \
            --body "Recalculo automático de métricas públicas (GitHub, PyPI, npm, Docker Hub, OpenSSF Scorecard) y de la puntuación de calidad. Revisa los cambios de puntuación antes de fusionar. No retira ni añade repos."
